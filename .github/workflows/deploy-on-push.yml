name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main

jobs:
  deploy-on-push-main:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Private Docker Registry
        uses: docker/login-action@v2
        with:
          registry: localhost:5000
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Docker image and give it tag
        run: |
          docker build -t makna-ai:latest .
          docker tag makna-ai:latest localhost:5000/makna-ai:latest

      - name: Push Docker image to local registry
        run: |
          docker push localhost:5000/makna-ai:latest

      - name: Pull Docker image on runner
        run: |
          docker pull localhost:5000/makna-ai:latest

      - name: Create .env file
        run: |
          echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" > .env
          echo "MILVUS_TOKEN=${{ secrets.MILVUS_TOKEN }}" >> .env
          echo "MILVUS_URI=${{ secrets.MILVUS_URI }}" >> .env
          echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "CO_API_KEY=${{ secrets.CO_API_KEY }}" >> .env

      - name: Run Docker Compose
        run: |
          docker compose down
          docker compose up -d
